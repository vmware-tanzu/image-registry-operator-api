version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - nakedret
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
            - '!$test'
          deny:
            - pkg: io/ioutil
              desc: 'replaced by io and os packages since Go 1.16: https://tip.golang.org/doc/go1.16#ioutil'
            - pkg: github.com/pkg/errors
              desc: 'replaced by stdlib errors package since Go.13: https://go.dev/blog/go1.13-errors'
            - pkg: k8s.io/utils
              desc: replaced by internal packages like pkg/util/ptr
            - pkg: testing
              desc: do not import testing packages in non-test sources
            - pkg: github.com/onsi/ginkgo$
              desc: do not import testing packages in non-test sources
            - pkg: github.com/onsi/ginkgo/v2
              desc: do not import testing packages in non-test sources
            - pkg: github.com/onsi/gomega
              desc: do not import testing packages in non-test sources
        test:
          list-mode: lax
          files:
            - $test
          deny:
            - pkg: io/ioutil
              desc: 'replaced by io and os packages since Go 1.16: https://tip.golang.org/doc/go1.16#ioutil'
            - pkg: github.com/pkg/errors
              desc: 'replaced by stdlib errors package since Go.13: https://go.dev/blog/go1.13-errors'
            - pkg: k8s.io/utils
              desc: replaced by internal packages like pkg/util/ptr
            - pkg: github.com/onsi/ginkgo$
              desc: replaced by github.com/onsi/ginkgo/v2
    importas:
      alias:
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: github.com/vmware-tanzu/image-registry-operator-api/api/v1alpha1
          alias: imgregopv1a1
        - pkg: github.com/vmware-tanzu/image-registry-operator-api/api/v1alpha2
          alias: imgregopv1
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        text: .*should have comment.* or be unexported
      - path: _conversion.go
        text: .*use underscores in Go names
      - path: _conversion.go
        text: 'G103: Use of unsafe calls should be audited'
      - path: _conversion.go
        text: .*receiver name
      - path: _test.go
        text: should not use dot imports
      - path: (.+)\.go$
        text: 'ST1000: at least one file in a package should have a package comment'
    paths:
      - .*generated.*\.go
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vmware-tanzu
  exclusions:
    generated: lax
    paths:
      - .*generated.*\.go
      - third_party$
      - builtin$
      - examples$
